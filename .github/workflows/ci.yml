name: ci

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      CHIEF_MIGRATE_TARGET: development
      CHIEF_MIGRATE_LOCAL: "1"
      CHIEF_PROOF_MIGRATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: migrate disposable database
        run: |
          node --input-type=module <<'EOF'
          import pg from "pg";
          const pool = new pg.Pool({ connectionString: process.env.DIRECT_URL });
          await pool.query(`
            CREATE TABLE IF NOT EXISTS "_prisma_migrations" (
              "id" VARCHAR(36) PRIMARY KEY NOT NULL,
              "checksum" VARCHAR(64) NOT NULL,
              "finished_at" TIMESTAMPTZ,
              "migration_name" VARCHAR(255) NOT NULL,
              "logs" TEXT,
              "rolled_back_at" TIMESTAMPTZ,
              "started_at" TIMESTAMPTZ NOT NULL DEFAULT now(),
              "applied_steps_count" INTEGER NOT NULL DEFAULT 0
            )
          `);
          await pool.query(`
            CREATE TABLE IF NOT EXISTS freedom_migration_identity (
              environment text NOT NULL,
              database_name text NOT NULL,
              migrate_role text NOT NULL
            )
          `);
          await pool.query("DELETE FROM freedom_migration_identity");
          await pool.query(`
            INSERT INTO freedom_migration_identity (environment, database_name, migrate_role)
            SELECT 'development', current_database(), current_user
          `);
          await pool.end();
          EOF
          node scripts/prisma-migrate-deploy.mjs
      - run: npm run lint
      # Vite boots esbuild inside several test files. Full parallelism on the
      # runner segfaults one of those processes. Two files at a time still
      # runs every test.
      - run: node --test --test-concurrency=2 --experimental-test-module-mocks test/*.test.js
      - name: schema-compat
        run: node scripts/schema-compat.mjs --role=all
