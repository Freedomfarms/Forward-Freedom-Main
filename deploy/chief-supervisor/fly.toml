# Prepared only. Do not run fly deploy from this assignment.
app = "freedom-os-chief-supervisor"
primary_region = "iad"

[build]
  dockerfile = "deploy/chief-supervisor/Dockerfile"

[processes]
  supervisor = "node scripts/chief-managed-supervisor.mjs"

[env]
  CHIEF_SUPERVISOR_MODE = "embedded"
  CHIEF_SUPERVISOR_LISTEN = "1"
  CHIEF_SUPERVISOR_INTERVAL_MS = "30000"

[[services]]
  internal_port = 8787
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8787

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
